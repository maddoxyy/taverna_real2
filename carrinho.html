<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Taverna | Meu Carrinho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --cinza-escuro: #1a202c;
            --dourado: #f2a900;
            --laranja: #f4a261;
            --dourado-claro: #ffc247;
            --cinza-claro: #e2e8f0;
            --card-bg: #272f45f2;
            --card-shadow: rgba(0,0,0,0.5);
            --nav-bg-default: transparent;
            --nav-bg-scrolled: #1a202c;
            --nav-link-default: var(--cinza-claro);
            --nav-link-scrolled: var(--dourado);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
        }

        @font-face {
            font-family: 'Montserrat';
            src: url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: var(--nav-bg-default);
            transition: all 0.4s cubic-bezier(0.215, 0.61, 0.355, 1);
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        header.scrolled {
            background-color: rgba(26, 32, 44, 0.95);
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            padding: 15px 40px;
        }

        .logo {
            height: 90px;
            transition: all 0.4s;
        }

        header.scrolled .logo {
            height: 60px;
            filter: brightness(1.1);
        }

        nav a {
            color: var(--nav-link-default);
            text-decoration: none;
            margin: 0 18px;
            font-weight: 500;
            font-size: 1.05rem;
            transition: all 0.3s ease-out;
            position: relative;
        }

        header.scrolled nav a {
            color: var(--nav-link-scrolled);
        }

        nav a:hover {
            color: var(--dourado-claro);
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background: linear-gradient(to right, var(--dourado), var(--laranja));
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1400px;
            padding: 160px 40px 60px;
            width: 100%;
            flex: 1;
        }

        body {
            background: linear-gradient(145deg, var(--cinza-escuro), #131823);
            color: var(--cinza-claro);
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 3.2rem;
            background: linear-gradient(90deg, var(--dourado), var(--laranja));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(to right, var(--dourado), var(--laranja));
            border-radius: 3px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            font-size: 1rem;
            color: var(--cinza-claro);
        }

        .breadcrumb a {
            color: var(--dourado);
            text-decoration: none;
            margin: 0 8px;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .breadcrumb a:hover {
            color: var(--dourado-claro);
            text-shadow: 0 0 10px rgba(242, 169, 0, 0.5);
        }

        .breadcrumb .separator {
            margin: 0 5px;
            color: var(--laranja);
            font-size: 0.8rem;
        }

        .carrinho-container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 80px;
        }

        .itens-carrinho {
            flex: 2;
            min-width: 350px;
        }

        .resumo-carrinho {
            flex: 1;
            min-width: 350px;
        }

        .carrinho-vazio {
            text-align: center;
            width: 100%;
            padding: 80px 0;
            animation: fadeIn 0.6s ease-out;
        }

        .carrinho-vazio i {
            font-size: 4.5rem;
            color: var(--dourado);
            margin-bottom: 25px;
            background: linear-gradient(to right, var(--dourado), var(--laranja));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .carrinho-vazio h2 {
            color: var(--cinza-claro);
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .carrinho-vazio p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 35px;
            font-size: 1.1rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .btn-primario {
            background: linear-gradient(135deg, var(--dourado), var(--laranja));
            color: var(--cinza-escuro);
            border: none;
            padding: 15px 35px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.215, 0.61, 0.355, 1);
            font-size: 1.05rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(242, 169, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primario::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-primario:hover::before {
            left: 100%;
        }

        .btn-primario:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(242, 169, 0, 0.4);
        }

        .btn-primario:active {
            transform: translateY(-1px);
        }

        .item-carrinho {
            display: flex;
            gap: 25px;
            padding: 25px;
            background-color: var(--card-bg);
            border-radius: 15px;
            margin-bottom: 25px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.215, 0.61, 0.355, 1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
        }

        .item-carrinho:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
            border-color: rgba(242, 169, 0, 0.2);
        }

        .item-imagem {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
        }

        .item-carrinho:hover .item-imagem {
            transform: scale(1.05);
        }

        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-nome {
            color: var(--dourado);
            font-size: 1.3rem;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .item-ano {
            color: var(--laranja);
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .item-preco {
            font-weight: 700;
            color: white;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .item-controles {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 5px;
        }

        .quantidade-controle {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 30px;
            padding: 5px 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .quantidade-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.1);
            color: white;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .quantidade-btn:hover {
            background-color: var(--dourado);
            color: var(--cinza-escuro);
            transform: scale(1.1);
        }

        .quantidade-valor {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
        }

        .remover-item {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .remover-item:hover {
            background: rgba(255, 107, 107, 0.1);
            color: #ff5252;
        }

        .remover-item i {
            font-size: 0.9rem;
        }

        .resumo-carrinho-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            position: sticky;
            top: 160px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            transition: all 0.4s;
        }

        .resumo-carrinho-card:hover {
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            transform: translateY(-3px);
        }

        .resumo-carrinho-card h2 {
            color: var(--dourado);
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            padding-bottom: 10px;
        }

        .resumo-carrinho-card h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 2px;
            background: linear-gradient(to right, var(--dourado), var(--laranja));
        }

        .resumo-linha {
            display: flex;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .resumo-linha span:first-child {
            color: rgba(255,255,255,0.8);
        }

        .resumo-linha span:last-child {
            font-weight: 500;
        }

        .resumo-total {
            font-weight: 700;
            font-size: 1.3rem;
            color: white;
            margin: 30px 0;
            display: flex;
            justify-content: space-between;
        }

        .resumo-total span:last-child {
            color: var(--dourado);
            font-size: 1.5rem;
        }

        .resumo-acoes {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn-secundario {
            background: transparent;
            color: var(--dourado);
            border: 1px solid var(--dourado);
            padding: 15px 35px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.215, 0.61, 0.355, 1);
            font-size: 1.05rem;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-secundario:hover {
            background: rgba(242, 169, 0, 0.1);
            border-color: var(--dourado-claro);
            color: var(--dourado-claro);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(242, 169, 0, 0.1);
        }

        .cupom-input {
            display: flex;
            margin: 25px 0;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .cupom-input input {
            flex: 1;
            padding: 0 20px;
            border: none;
            background-color: rgba(255,255,255,0.1);
            color: white;
            outline: none;
            font-size: 1rem;
        }

        .cupom-input input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .cupom-input button {
            padding: 0 25px;
            border: none;
            background: linear-gradient(to right, var(--dourado), var(--laranja));
            color: var(--cinza-escuro);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cupom-input button:hover {
            background: linear-gradient(to right, var(--dourado-claro), #f5b078);
        }

        .metodos-pagamento {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .metodo-pagamento {
            width: 50px;
            height: 30px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        .metodo-pagamento img {
            max-width: 100%;
            max-height: 100%;
            filter: brightness(0) invert(1);
            opacity: 0.7;
            transition: all 0.3s;
        }

        .metodo-pagamento:hover img {
            opacity: 1;
            transform: scale(1.1);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: var(--dourado);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        @media (max-width: 992px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .carrinho-container {
                gap: 30px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .hero {
                padding: 140px 20px 40px;
            }
            
            .item-carrinho {
                flex-direction: column;
                gap: 20px;
            }
            
            .item-imagem {
                width: 100%;
                height: 180px;
            }
            
            .resumo-carrinho-card {
                position: static;
            }
            
            .quantidade-controle {
                margin-right: auto;
            }

            @media (max-width: 768px) {
                .carrinho-container {
                    flex-direction: column;
                }
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="taverna logo v3.svg" alt="Logo Taverna" class="logo" />
        <nav>

            <a href="estoque.html">Estoque</a>

            <a href="perfil.html">Perfil</a>
        </nav>

    <script>
    const CARRINHO_API_URL = 'http://127.0.0.1:8000/api/carrinho';
    

   function getAuthToken() {
        return localStorage.getItem('auth_token');
    }


    function fetchCarrinho() {
        document.querySelector('.itens-carrinho').innerHTML = `
            <div class="carrinho-vazio">
                <div class="loading"></div>
                <p>Carregando seu carrinho...</p>
            </div>
        `;
        
      
        const token = getAuthToken();

       
        const headers = {
            'Accept': 'application/json',      
            'Content-Type': 'application/json'  
        };
        
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }
        
        const xhr = new XMLHttpRequest();

        xhr.open('GET', CARRINHO_API_URL, true);
        
        Object.keys(headers).forEach(key => {
            xhr.setRequestHeader(key, headers[key]);
        });
        
        xhr.onload = function() {
            console.log('Status:', xhr.status, 'Resposta:', xhr.responseText);
            
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    const response = JSON.parse(xhr.responseText);

                    if (response.success) {
                        renderCarrinho(response.data);
                    } else {
                        showError('Erro ao carregar carrinho: ' + response.message);
                    }
                } catch (error) {
                    console.error('Erro ao parsear JSON:', error);
                    showError('Erro ao processar os dados do carrinho.');
                }
            } 
            else if (xhr.status === 401) {
                showError('Você precisa estar logado para ver o carrinho');
            } 
            else {
                showError('Erro ao carregar carrinho. Status: ' + xhr.status);
            }
        };
        
        xhr.onerror = function() {
            showError('Erro de conexão. Verifique sua internet.');
        };
        
        xhr.timeout = 10000;

        xhr.ontimeout = function() {
            showError('Tempo de conexão esgotado.');
        };
        
        xhr.send();
    }


    function atualizarQuantidade(produtoId, quantidade, headers) {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', CARRINHO_API_URL + '/atualizar', true);
        Object.keys(headers).forEach(key => {
            xhr.setRequestHeader(key, headers[key]);
        });
        
        xhr.onload = function() {
            if (xhr.status === 200) {
                fetchCarrinho();
            } else {
                showError('Erro ao atualizar quantidade');
            }
        };
        
        xhr.send(JSON.stringify({
            produto_id: produtoId,
            quantidade: quantidade
        }));
    }

    function removerItemCarrinho(produtoId) {
        if (confirm('Tem certeza que deseja remover este item do carrinho?')) {
            const token = getAuthToken();
            const headers = {};
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            
            removerItem(produtoId, headers);
        }
    }

    function removerItem(produtoId, headers) {
        const xhr = new XMLHttpRequest();
        xhr.open('DELETE', CARRINHO_API_URL + '/remover/' + produtoId, true);
        Object.keys(headers).forEach(key => {
            xhr.setRequestHeader(key, headers[key]);
        });
        
        xhr.onload = function() {
            if (xhr.status === 200) {
                fetchCarrinho();
                showMessage('Item removido do carrinho!');
            } else {
                showError('Erro ao remover item');
            }
        };
        
        xhr.send();
    }

    // Função para mostrar erro
    function showError(message) {
        console.error('Erro:', message);
        alert('Erro: ' + message);
    }

    // Função para mostrar mensagem
    function showMessage(message) {
        console.log('Sucesso:', message);
        alert(message);
    }

    // Função para atualizar frete
    function atualizarFrete() {
        fetchCarrinho(); // Recarregar para atualizar totais
    }

    // Inicializar a página
    document.addEventListener('DOMContentLoaded', function() {
        fetchCarrinho();
        
        // Configurar eventos
        document.querySelectorAll('input[name="frete"]').forEach(radio => {
            radio.addEventListener('change', atualizarFrete);
        });
        
        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    });

    function getCookie(nome) {
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const c = cookies[i].trim();
                if (c.indexOf(nome + "=") === 0) {
                    return c.substring((nome + "=").length, c.length);
                }
            }
            return null;
        }

        // Função para exibir todos os cookies na página
        function displayCookies() {
            const cookieContainer = document.getElementById("cookieContainer");
            const cookies = document.cookie.split(";");
            
            if (cookies.length === 0 || (cookies.length === 1 && cookies[0] === "")) {
                cookieContainer.innerHTML = "<div class='cookie-item'>Nenhum cookie encontrado.</div>";
                return;
            }
            
            cookieContainer.innerHTML = "";
            cookies.forEach(cookie => {
                const cookieItem = document.createElement("div");
                cookieItem.className = "cookie-item";
                cookieItem.textContent = cookie.trim();
                cookieContainer.appendChild(cookieItem);
            });
        }

        // Função principal para verificar autenticação
        function checkAuth() {
            console.clear();
            console.log("=== VERIFICAÇÃO DE TOKEN E COOKIES ===");
            
            // Recupera cookies
            const userId = getCookie("user_id");
            const token = getCookie("token");
            
            // Exibe no console
            console.log("🔍 Cookies recuperados:");
            console.log("user_id:", userId);
            console.log("token:", token);
            
            // Exibe todos os cookies disponíveis
            console.log("🍪 Todos os cookies:", document.cookie);
            
            if (token) {
                console.log("✅ Token encontrado! Usuário potencialmente autenticado.");
            } else {
                console.log("❌ Nenhum token encontrado. Usuário não autenticado.");
            }
            
            // Atualiza a exibição de cookies na página
            displayCookies();
        }

        // Executa automaticamente quando a página carrega
        window.onload = function() {
            console.log("Página carregada. Use o botão para verificar token e cookies.");
            displayCookies();
        };
</script>
